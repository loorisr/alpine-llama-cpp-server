name: Build and push Docker image

on:
  schedule:
    - cron: '0 5 * * 2'  # every Tuesday at 5 AM UTC
  workflow_dispatch: # on demand

permissions:
  contents: read
  packages: write # to push to GitHub Container Registry (GHCR)

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Get current llama.cpp master commit
        id: get_sha
        run: |
          sha=$(git ls-remote https://github.com/ggml-org/llama.cpp HEAD | cut -f1)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Checkout my repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GitHub Container Registry
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            LLAMA_GIT_REF=${{ steps.get_sha.outputs.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:edge
            ghcr.io/${{ github.repository }}:sha-${{ steps.get_sha.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.get_sha.outputs.sha }}
